<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .ctl{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.4}
      .reg{fill:#ffffff;stroke:#333;stroke-width:1.4}
      .ring{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .lut{fill:#fff7ed;stroke:#ea580c;stroke-width:1.4}
      .alu{fill:#fef2f2;stroke:#dc2626;stroke-width:1.4}
      .pin{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.2}
      .w{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .wd{stroke:#6b7280;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .s{fill:#555;font-size:11.5px}
      .h{font-weight:bold;fill:#111}
      .m{fill:#111;font-family:Consolas, Menlo, monospace;font-size:12px}
      .sec{font-weight:bold;fill:#374151;font-size:14px}
    </style>
  </defs>
  <rect width="960" height="570" fill="#ffffff"/>

  <!-- control row -->
  <rect class="pin" x="20" y="20" width="120" height="60" rx="5"/>
  <text class="h" x="80" y="44" text-anchor="middle">uio[1:0]</text>
  <text class="s" x="80" y="62" text-anchor="middle">STROBE, CLEAR</text>
  <rect class="ctl" x="180" y="20" width="140" height="60" rx="5"/>
  <text class="h" x="250" y="44" text-anchor="middle">Synchronisers</text>
  <text class="s" x="250" y="62" text-anchor="middle">2 flops + edge detect</text>
  <path class="w" d="M140,50 L178,50"/>
  <rect class="ctl" x="360" y="20" width="580" height="60" rx="5"/>
  <text class="h" x="650" y="43" text-anchor="middle">Control FSM: one timestep = 8 bytes, then three passes</text>
  <text class="m" x="650" y="64" text-anchor="middle">BYTE 192 clk ×8 → FIN1 24 → L2 240 → FIN2 10 → IDLE</text>
  <path class="w" d="M320,50 L358,50"/>

  <!-- input byte -->
  <rect class="pin" x="20" y="110" width="120" height="44" rx="5"/>
  <text class="h" x="80" y="129" text-anchor="middle">ui[7:0]</text>
  <text class="s" x="80" y="145" text-anchor="middle">8 input spikes</text>
  <rect class="reg" x="180" y="110" width="140" height="44" rx="5"/>
  <text class="h" x="250" y="129" text-anchor="middle">din[7:0]</text>
  <text class="s" x="250" y="145" text-anchor="middle">latched on STROBE</text>
  <path class="w" d="M140,132 L178,132"/>

  <!-- hidden layer -->
  <text class="sec" x="360" y="125">Hidden layer: 24 LIF neurons</text>
  <circle class="ring" cx="430" cy="225" r="62"/>
  <text class="h" x="430" y="212" text-anchor="middle">hidden ring</text>
  <text class="s" x="430" y="230" text-anchor="middle">24 × 8-bit</text>
  <text class="s" x="430" y="246" text-anchor="middle">rotates every clock</text>
  <text class="s" x="500" y="172">head</text>
  <path class="w" d="M486,197 L538,197"/>
  <path class="w" d="M540,255 L488,255"/>
  <text class="s" x="500" y="275">tail</text>

  <rect class="alu" x="540" y="170" width="270" height="105" rx="6"/>
  <text class="h" x="675" y="190" text-anchor="middle">update the neuron at the head</text>
  <text class="m" x="552" y="215">BYTE: v += din[pix] ? W1 : 0</text>
  <text class="m" x="552" y="238">FIN1: v = sat6(v); s = v ≥ 8</text>
  <text class="m" x="595" y="256">v -= 8·s; v -= v &gt;&gt;&gt; 4</text>
  <path class="w" d="M320,132 L600,132 L600,168"/>

  <rect class="lut" x="840" y="160" width="100" height="62" rx="5"/>
  <text class="h" x="890" y="182" text-anchor="middle">W1</text>
  <text class="s" x="890" y="198" text-anchor="middle">1,536 ternary</text>
  <text class="s" x="890" y="212" text-anchor="middle">weights as logic</text>
  <path class="w" d="M840,191 L812,191"/>

  <rect class="reg" x="840" y="250" width="100" height="46" rx="5"/>
  <text class="h" x="890" y="270" text-anchor="middle">hspk[23:0]</text>
  <text class="s" x="890" y="286" text-anchor="middle">hidden spikes</text>
  <path class="w" d="M810,262 L838,262"/>
  <text class="s" x="815" y="290">s</text>

  <!-- output layer -->
  <text class="sec" x="360" y="335">Output layer: 10 LIF neurons</text>
  <circle class="ring" cx="430" cy="430" r="62"/>
  <text class="h" x="430" y="417" text-anchor="middle">output ring</text>
  <text class="s" x="430" y="435" text-anchor="middle">10 × {count, acc}</text>
  <text class="s" x="430" y="451" text-anchor="middle">rotates every clock</text>
  <text class="s" x="500" y="377">head</text>
  <path class="w" d="M486,402 L538,402"/>
  <path class="w" d="M540,460 L488,460"/>
  <text class="s" x="500" y="480">tail</text>

  <rect class="alu" x="540" y="375" width="270" height="105" rx="6"/>
  <text class="h" x="675" y="395" text-anchor="middle">update the neuron at the head</text>
  <text class="m" x="552" y="420">L2:   v += hspk[0] ? W2 : 0</text>
  <text class="m" x="552" y="443">FIN2: v = sat6(v); s = v ≥ 4</text>
  <text class="m" x="595" y="461">count += s; argmax</text>
  <path class="w" d="M890,296 L890,340 L660,340 L660,373"/>

  <rect class="lut" x="840" y="372" width="100" height="62" rx="5"/>
  <text class="h" x="890" y="394" text-anchor="middle">W2</text>
  <text class="s" x="890" y="410" text-anchor="middle">240 ternary</text>
  <text class="s" x="890" y="424" text-anchor="middle">weights as logic</text>
  <path class="w" d="M840,403 L812,403"/>

  <!-- outputs -->
  <rect class="pin" x="760" y="505" width="180" height="50" rx="5"/>
  <text class="h" x="850" y="525" text-anchor="middle">uo[7:0]</text>
  <text class="s" x="850" y="542" text-anchor="middle">class · DONE · BUSY, or debug</text>
  <path class="w" d="M675,480 L675,530 L758,530"/>
  <text class="s" x="682" y="500">predicted class</text>
  <rect class="pin" x="20" y="505" width="120" height="50" rx="5"/>
  <text class="h" x="80" y="525" text-anchor="middle">uio[6:2]</text>
  <text class="s" x="80" y="542" text-anchor="middle">debug select</text>
  <path class="wd" d="M140,548 L758,548"/>
</svg>
