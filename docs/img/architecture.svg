<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .ctl{fill:#eef2ff;stroke:#4f46e5;stroke-width:1.4}
      .reg{fill:#ffffff;stroke:#333;stroke-width:1.4}
      .ring{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .lut{fill:#fff7ed;stroke:#ea580c;stroke-width:1.4}
      .alu{fill:#fef2f2;stroke:#dc2626;stroke-width:1.4}
      .pin{fill:#f3f4f6;stroke:#6b7280;stroke-width:1.2}
      .w{stroke:#333;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .wd{stroke:#6b7280;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .s{fill:#555;font-size:11.5px}
      .h{font-weight:bold;fill:#111}
      .m{fill:#111;font-family:Consolas, Menlo, monospace;font-size:12px}
      .sec{font-weight:bold;fill:#374151;font-size:14px}
    </style>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- control row -->
  <rect class="pin" x="20" y="20" width="120" height="60" rx="5"/>
  <text class="h" x="80" y="44" text-anchor="middle">uio[1:0]</text>
  <text class="s" x="80" y="62" text-anchor="middle">STROBE, CLEAR</text>
  <rect class="ctl" x="180" y="20" width="140" height="60" rx="5"/>
  <text class="h" x="250" y="44" text-anchor="middle">Synchronisers</text>
  <text class="s" x="250" y="62" text-anchor="middle">2 flops + edge detect</text>
  <path class="w" d="M140,50 L178,50"/>
  <rect class="ctl" x="360" y="20" width="580" height="60" rx="5"/>
  <text class="h" x="650" y="43" text-anchor="middle">Control FSM: one timestep = 8 bytes, then one finalise pass</text>
  <text class="m" x="650" y="64" text-anchor="middle">(BYTE 80 clk) ×8 → FIN 10 clk → IDLE</text>
  <path class="w" d="M320,50 L358,50"/>

  <!-- input byte -->
  <rect class="pin" x="20" y="110" width="120" height="44" rx="5"/>
  <text class="h" x="80" y="129" text-anchor="middle">ui[7:0]</text>
  <text class="s" x="80" y="145" text-anchor="middle">8 input spikes</text>
  <rect class="reg" x="180" y="110" width="140" height="44" rx="5"/>
  <text class="h" x="250" y="129" text-anchor="middle">din[7:0]</text>
  <text class="s" x="250" y="145" text-anchor="middle">latched on STROBE</text>
  <path class="w" d="M140,132 L178,132"/>

  <!-- neuron ring -->
  <text class="sec" x="340" y="162">10 LIF neurons, one per digit</text>
  <circle class="ring" cx="430" cy="240" r="62"/>
  <text class="h" x="430" y="220" text-anchor="middle">neuron ring</text>
  <text class="s" x="430" y="238" text-anchor="middle">10 × {count, acc}</text>
  <text class="s" x="430" y="254" text-anchor="middle">rotates every clock</text>
  <text class="s" x="502" y="180">head</text>
  <path class="w" d="M488,205 L538,205"/>
  <path class="w" d="M540,268 L490,268"/>
  <text class="s" x="502" y="290">tail</text>

  <rect class="alu" x="540" y="170" width="290" height="125" rx="6"/>
  <text class="h" x="685" y="190" text-anchor="middle">update the neuron at the head</text>
  <text class="m" x="552" y="215">BYTE: acc += din[pix] ? W : 0</text>
  <text class="m" x="552" y="238">FIN:  v = sat8(acc); s = v ≥ 8</text>
  <text class="m" x="597" y="256">count += s; v -= 8·s</text>
  <text class="m" x="597" y="274">v -= v &gt;&gt;&gt; 4; argmax</text>
  <path class="w" d="M320,132 L620,132 L620,168"/>

  <rect class="lut" x="855" y="190" width="90" height="70" rx="5"/>
  <text class="h" x="900" y="212" text-anchor="middle">W</text>
  <text class="s" x="900" y="229" text-anchor="middle">640 ternary</text>
  <text class="s" x="900" y="244" text-anchor="middle">as logic</text>
  <path class="w" d="M855,225 L832,225"/>

  <!-- outputs -->
  <rect class="pin" x="760" y="350" width="180" height="50" rx="5"/>
  <text class="h" x="850" y="370" text-anchor="middle">uo[7:0]</text>
  <text class="s" x="850" y="387" text-anchor="middle">class · DONE · BUSY, or debug</text>
  <path class="w" d="M685,295 L685,375 L758,375"/>
  <text class="s" x="692" y="320">predicted class</text>
  <rect class="pin" x="20" y="350" width="120" height="50" rx="5"/>
  <text class="h" x="80" y="370" text-anchor="middle">uio[6:2]</text>
  <text class="s" x="80" y="387" text-anchor="middle">debug select</text>
  <path class="wd" d="M140,393 L758,393"/>
</svg>
