<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Where the silicon goes">
<title>Where the silicon goes</title>
<rect width="1000" height="320" rx="12" fill="#0d1117"/>
<text x="30" y="36" font-size="16" fill="#e6edf3" text-anchor="start" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Where the silicon goes</text>
<text x="30" y="57" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Placed cell area by class inside the 1x1-tile core (16,493 µm²). Design cells use 74.6% of it.</text>
<line x1="280.0" y1="78" x2="280.0" y2="294" stroke="#30363d" stroke-width="1"/>
<text x="280.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">0 µm²</text>
<line x1="466.7" y1="78" x2="466.7" y2="294" stroke="#30363d" stroke-width="1"/>
<text x="466.7" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2,000 µm²</text>
<line x1="653.3" y1="78" x2="653.3" y2="294" stroke="#30363d" stroke-width="1"/>
<text x="653.3" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">4,000 µm²</text>
<line x1="840.0" y1="78" x2="840.0" y2="294" stroke="#30363d" stroke-width="1"/>
<text x="840.0" y="72" font-size="11" fill="#8b949e" text-anchor="middle" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">6,000 µm²</text>
<text x="268" y="103.5" font-size="12.5" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Fill / decap cells</text>
