<text x="268" y="283.5" font-size="12.5" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Well taps</text>
<path d="M280 270h22.28a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-22.28z" fill="#3987e5"/>
<text x="318.3" y="283.5" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">282 µm² · 1.7% · 225 cells</text>
