<text x="268" y="163.5" font-size="12.5" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Flip-flops</text>
<path d="M280 150h373.20a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-373.20z" fill="#3987e5"/>
<text x="669.2" y="163.5" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4,041 µm² · 24.5% · 190 cells</text>
<text x="268" y="193.5" font-size="12.5" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Timing-repair buffers</text>
<path d="M280 180h211.69a4 4 0 0 1 4 4v10a4 4 0 0 1 -4 4h-211.69z" fill="#3987e5"/>
