<text x="683.3" y="103.5" font-size="12" fill="#8b949e" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4,193 µm² · 25.4% · 1,326 cells</text>
<text x="268" y="133.5" font-size="12.5" fill="#e6edf3" text-anchor="end" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Combinational logic</text>
